workflows:
  maui-ios:
    name: OBD360 iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Admin

    environment:
      xcode: 26.6

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gcar360.app

      vars:
        # Keep the SDK outside the cloned repository. Otherwise the SDK's own
        # *.cs tooling files are picked up by the project's default Compile glob.
        DOTNET_PATH: $HOME/.gcar360-dotnet
        DOTNET: $HOME/.gcar360-dotnet/dotnet
        APP_STORE_APPLE_ID: "6817508639"

    scripts:
      - name: Pull Git LFS
        script: |
          git lfs pull

      - name: Install .NET SDK
        script: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh \
            --version 10.0.401 \
            --install-dir "$DOTNET_PATH"

          "$DOTNET" --version

      - name: Install MAUI iOS workload
        script: |
          "$DOTNET" workload install ios maui --version 10.0.401
          "$DOTNET" workload --info

      - name: Build OBD360 IPA
        script: |
          IOS_TFM=$(grep -oE 'net[0-9]+\.[0-9]+-ios' CarScanner.csproj | head -1)

          echo "iOS Target Framework: $IOS_TFM"

          # Marketing version comes from CarScanner.csproj (single source of truth).
          APP_DISPLAY_VERSION=$(grep -oE '<ApplicationDisplayVersion>[^<]+' CarScanner.csproj | head -1 | sed 's/<ApplicationDisplayVersion>//')
          if [ -z "$APP_DISPLAY_VERSION" ]; then APP_DISPLAY_VERSION="1.0.0"; fi
          echo "App display version: $APP_DISPLAY_VERSION"

          CERT_NAME=$(keychain list-certificates | jq -r '.[] | .common_name' | head -1)

          PROFILE_NAME=$(find ~/Library/MobileDevice/Provisioning\ Profiles \
            -name "*.mobileprovision" \
            -execdir sh -c '/usr/libexec/PlistBuddy -c "print :Name" /dev/stdin <<< $(security cms -D -i "{}")' \; \
            | head -1)

          echo "Certificate: $CERT_NAME"
          echo "Provisioning profile: $PROFILE_NAME"

          "$DOTNET" publish CarScanner.csproj \
            -f "$IOS_TFM" \
            -c Release \
            -p:BuildIpa=True \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ApplicationId="com.gcar360.app" \
            -p:ApplicationDisplayVersion="$APP_DISPLAY_VERSION" \
            -p:ApplicationVersion="$BUILD_NUMBER" \
            -p:CodesignKey="$CERT_NAME" \
            -p:CodesignProvision="$PROFILE_NAME" \
            -p:EnableAppleSignIn=true \
            -o "$CM_BUILD_DIR/artifacts"

    artifacts:
      - artifacts/*.ipa
      - "**/*.ipa"

    publishing:
      app_store_connect:
        auth: integration

  maui-android:
    name: OBD360 Android
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      # Create a Codemagic environment variable group named "android_signing"
      # (Team settings -> Environment variables) with:
      #   CM_KEYSTORE_PATH     - the .keystore/.jks file, uploaded as a "File" variable
      #   CM_KEYSTORE_PASSWORD - the keystore password (Secure)
      #   CM_KEY_ALIAS         - the signing key alias (Secure)
      #   CM_KEY_PASSWORD      - the signing key password (Secure)
      # Same values as the local StoreRelease/Publish-Android.ps1 script's
      # -KeyStorePath / -KeyAlias / -PasswordFile parameters.
      groups:
        - android_signing

      vars:
        DOTNET_PATH: $HOME/.gcar360-dotnet
        DOTNET: $HOME/.gcar360-dotnet/dotnet

    scripts:
      - name: Pull Git LFS
        script: |
          git lfs pull

      - name: Install .NET SDK
        script: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh \
            --version 10.0.401 \
            --install-dir "$DOTNET_PATH"

          "$DOTNET" --version

      - name: Install MAUI Android workload
        script: |
          "$DOTNET" workload install android maui --version 10.0.401
          "$DOTNET" workload --info

      - name: Build signed AAB
        script: |
          "$DOTNET" publish CarScanner.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$CM_KEYSTORE_PATH" \
            -p:AndroidSigningKeyAlias="$CM_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$CM_KEY_PASSWORD" \
            -p:AndroidSigningStorePass="$CM_KEYSTORE_PASSWORD" \
            -p:AndroidPackageFormats=aab \
            -o "$CM_BUILD_DIR/artifacts"

    artifacts:
      - artifacts/*.aab
      - "**/*.aab"
