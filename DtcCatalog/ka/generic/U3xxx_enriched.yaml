    - https://en.wikipedia.org/wiki/Relay
- code: U3005
  category: network
  title:
    en: Retained Accessory Power
    ka: დამატებითი მოწყობილობების კვების შენარჩუნება
  description:
    en: Fault on the retained accessory power (RAP) function that keeps comfort loads (windows, radio) powered for a short time after the key is removed.
    ka: ხარვეზი აქსესუარების კვების შენარჩუნების (RAP) ფუნქციაში, რომელიც ინარჩუნებს კომფორტის სისტემების (ფანჯრები, რადიო) კვებას გასაღების ამოღებიდან მცირე ხნის განმავლობაში.
  affected_components:
    - rap_relay
    - body_control_module
  common_causes:
    - id: rap_module_failed
      likelihood: high
      label:
        en: RAP relay or BCM logic failed
        ka: RAP რელეს ან BCM ლოგიკის გაუმართაობა
    - id: gateway_module_fault
      likelihood: low
      label:
