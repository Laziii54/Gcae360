      ka: შესაძლოა აინთოს მრავალი გამაფრთხილებელი ნათურა
    - en: Affected modules may go into limp mode or shut down
      ka: დაზარალებული მოდულები შესაძლოა გადავიდნენ ავარიულ რეჟიმში ან გაითიშონ
    - en: Specific functions inoperative depending on module
      ka: კონკრეტული ფუნქციები არ მუშაობს მოდულის მიხედვით
    - en: Diagnostic tools may show communication faults
      ka: დიაგნოსტიკურმა ხელსაწყოებმა შეიძლება აჩვენოს კავშირის შეცდომები
  repair:
    difficulty: easy
    diy_possible: true
    estimated_cost_eur:
      - 20
      - 200
    estimated_hours:
      - 0.3
      - 1.5
  flags:
