- code: U3000
  category: network
  title:
    en: Control Module
    ka: მართვის მოდული
  description:
    en: Generic fault on the control module itself — internal self-diagnostic flagged a problem with computation, memory, drivers or other internal subsystems.
    ka: ზოგადი გაუმართაობა თავად მართვის მოდულში — შიდა თვითდიაგნოსტიკამ გამოავლინა პრობლემა გამოთვლებთან, მეხსიერებასთან, დრაივერებთან ან სხვა შიდა ქვესისტემებთან დაკავშირებით.
  affected_components:
    - control_module
  common_causes:
    - id: module_internal_fault
      likelihood: high
      label:
        en: Module internal fault
        ka: მოდულის შიდა ხარვეზი
    - id: gateway_module_fault
      likelihood: low
      label:
        en: Gateway module routing CAN messages incorrectly
        ka: გეითვეის მოდული არასწორად ანაწილებს CAN შეტყობინებებს
    - id: terminator_resistor_drift
      likelihood: low
      label:
        en: CAN terminating resistor (120 Ω) drifted out of spec
        ka: CAN-ის დამაბოლოებელი რეზისტორი (120 Ω) გასცდა დასაშვებ პარამეტრებს
  symptoms:
    - en: Multiple warning lights may illuminate
      ka: შესაძლოა აინთოს მრავალი გამაფრთხილებელი ნათურა
    - en: Affected modules may go into limp mode or shut down
      ka: დაზარალებული მოდულები შესაძლოა გადავიდნენ ავარიულ რეჟიმში ან გაითიშონ
    - en: Specific functions inoperative depending on module
      ka: კონკრეტული ფუნქციები არ მუშაობს მოდულის მიხედვით
    - en: Diagnostic tools may show communication faults
      ka: დიაგნოსტიკურმა ხელსაწყოებმა შეიძლება აჩვენოს კავშირის შეცდომები
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 300
      - 2500
    estimated_hours:
      - 1
      - 5
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  sources:
    - https://github.com/Wal33D/dtc-database
    - https://en.wikipedia.org/wiki/Engine_control_unit
- code: U3001
  category: network
  title:
    en: Control Module Improper Shutdown Performance
    ka: მართვის მოდულის არასწორი გამორთვის რეჟიმი
  description:
    en: The control module did not complete its shutdown sequence cleanly — power was lost before housekeeping (saving learned values, freeze frames, adaptations) finished.
    ka: მართვის მოდულმა ვერ დაასრულა გამორთვის თანმიმდევრობა სწორად — კვება შეწყდა მანამ, სანამ დასრულდებოდა მონაცემთა შენახვა (ნასწავლი მნიშვნელობები, ფრიზ-ფრეიმები, ადაპტაციები).
  affected_components:
    - control_module
    - module_power_supply
  common_causes:
    - id: power_loss
      likelihood: high
      label:
        en: Power supply lost before shutdown completed
        ka: კვების წყარო გაითიშა გამორთვის პროცესის დასრულებამდე
    - id: bad_ground
      likelihood: medium
      label:
        en: Bad ground connection
        ka: ცუდი დამიწების კონტაქტი
    - id: gateway_module_fault
      likelihood: low
      label:
        en: Gateway module routing CAN messages incorrectly
        ka: გეითვეის მოდული არასწორად ანაწილებს CAN შეტყობინებებს
  symptoms:
    - en: Multiple warning lights may illuminate
      ka: შესაძლოა აინთოს მრავალი გამაფრთხილებელი ნათურა
    - en: Affected modules may go into limp mode or shut down
      ka: დაზარალებული მოდულები შესაძლოა გადავიდნენ ავარიულ რეჟიმში ან გაითიშონ
    - en: Specific functions inoperative depending on module
      ka: კონკრეტული ფუნქციები არ მუშაობს მოდულის მიხედვით
    - en: Diagnostic tools may show communication faults
      ka: დიაგნოსტიკურმა ხელსაწყოებმა შეიძლება აჩვენოს კავშირის შეცდომები
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur:
      - 50
      - 500
    estimated_hours:
      - 0.5
      - 3
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  sources:
    - https://github.com/Wal33D/dtc-database
    - https://en.wikipedia.org/wiki/Engine_control_unit
- code: U3002
  category: network
  title:
    en: Vehicle Identification Number
    ka: ავტომობილის საიდენტიფიკაციო ნომერი (VIN)
  description:
    en: The control module reports a problem with the stored Vehicle Identification Number (VIN) — missing, mismatched between modules, or invalid format.
    ka: მართვის მოდული აფიქსირებს პრობლემას შენახულ ავტომობილის საიდენტიფიკაციო ნომერთან (VIN) — დაკარგულია, შეუსაბამოა მოდულებს შორის ან არასწორი ფორმატის.
  affected_components:
    - control_module
    - module_eeprom
  common_causes:
    - id: vin_mismatch
      likelihood: high
      label:
        en: VIN mismatch after module replacement
        ka: VIN-ის შეუსაბამობა მოდულის შეცვლის შემდეგ
    - id: vin_not_programmed
      likelihood: medium
      label:
        en: VIN not programmed in replacement module
        ka: VIN არ არის დაპროგრამებული ახალ მოდულში
    - id: gateway_module_fault
      likelihood: low
      label:
        en: Gateway module routing CAN messages incorrectly
        ka: გეითვეის მოდული არასწორად ანაწილებს CAN შეტყობინებებს
  symptoms:
    - en: Multiple warning lights may illuminate
      ka: შესაძლოა აინთოს მრავალი გამაფრთხილებელი ნათურა
    - en: Affected modules may go into limp mode or shut down
      ka: დაზარალებული მოდულები შესაძლოა გადავიდნენ ავარიულ რეჟიმში ან გაითიშონ
    - en: Specific functions inoperative depending on module
      ka: კონკრეტული ფუნქციები არ მუშაობს მოდულის მიხედვით
    - en: Diagnostic tools may show communication faults
      ka: დიაგნოსტიკურმა ხელსაწყოებმა შეიძლება აჩვენოს კავშირის შეცდომები
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur:
      - 50
      - 400
    estimated_hours:
      - 0.5
      - 2
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  sources:
    - https://github.com/Wal33D/dtc-database
    - https://en.wikipedia.org/wiki/Vehicle_identification_number
- code: U3003
  category: network
  title:
    en: Battery Voltage
    ka: აკუმულატორის ძაბვა
  description:
    en: The control module detected battery voltage outside its acceptable operating window. Either too low (drained battery, weak charging) or too high (charging system overvoltage).
    ka: მართვის მოდულმა დააფიქსირა აკუმულატორის ძაბვა, რომელიც სცდება მისაღები სამუშაო დიაპაზონის ფარგლებს. ძაბვა ან ზედმეტად დაბალია (აკუმულატორი დაჯდა, სუსტი დამუხტვა), ან ზედმეტად მაღალია (დამუხტვის სისტემის გადაძაბვა).
  affected_components:
    - battery
    - alternator
    - charging_system
  common_causes:
    - id: weak_battery
      likelihood: high
      label:
        en: Battery aged or sulfated
        ka: აკუმულატორის ცვეთა ან სულფატაცია
    - id: charging_fault
      likelihood: medium
      label:
        en: Alternator regulator fault (over- or undervoltage)
        ka: გენერატორის რეგულატორის ხარვეზი (ზედმეტად მაღალი ან დაბალი ძაბვა)
    - id: gateway_module_fault
      likelihood: low
      label:
        en: Gateway module routing CAN messages incorrectly
        ka: გეითვეის მოდული არასწორად ანაწილებს CAN შეტყობინებებს
  symptoms:
    - en: Multiple warning lights may illuminate
      ka: შესაძლოა აინთოს მრავალი გამაფრთხილებელი ნათურა
    - en: Affected modules may go into limp mode or shut down
      ka: დაზარალებული მოდულები შესაძლოა გადავიდნენ ავარიულ რეჟიმში ან გაითიშონ
    - en: Specific functions inoperative depending on module
      ka: კონკრეტული ფუნქციები არ მუშაობს მოდულის მიხედვით
    - en: Diagnostic tools may show communication faults
      ka: დიაგნოსტიკურმა ხელსაწყოებმა შეიძლება აჩვენოს კავშირის შეცდომები
  repair:
    difficulty: easy
    diy_possible: true
    estimated_cost_eur:
      - 80
      - 600
    estimated_hours:
      - 0.3
      - 2
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  sources:
    - https://github.com/Wal33D/dtc-database
    - https://en.wikipedia.org/wiki/Automotive_battery
- code: U3004
  category: network
  title:
    en: Accessory Power Relay
    ka: დამატებითი მოწყობილობების კვების რელე
  description:
    en: Fault on the accessory power relay that switches power to comfort/accessory loads (radio, infotainment, etc.) when the key is in ACC position.
    ka: დამატებითი მოწყობილობების კვების რელეს გაუმართაობა, რომელიც რთავს კვებას კომფორტის/დამატებითი დატვირთვებისთვის (რადიო, ინფოტაინმენტი და ა.შ.), როდესაც გასაღები არის ACC პოზიციაში.
  affected_components:
    - accessory_power_relay
    - relay_wiring
  common_causes:
    - id: relay_failed
      likelihood: high
      label:
        en: Relay contacts failed or coil open
        ka: რელეს კონტაქტების დაზიანება ან კოჭის გაწყვეტა
    - id: gateway_module_fault
      likelihood: low
      label:
        en: Gateway module routing CAN messages incorrectly
        ka: გეითვეის მოდული არასწორად ანაწილებს CAN შეტყობინებებს
    - id: terminator_resistor_drift
      likelihood: low
      label:
        en: CAN terminating resistor (120 Ω) drifted out of spec
        ka: CAN-ის დამაბოლოებელი რეზისტორი (120 Ω) გასცდა დასაშვებ პარამეტრებს
