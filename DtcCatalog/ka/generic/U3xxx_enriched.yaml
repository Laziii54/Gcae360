- code: U3006
  category: network
  title:
    en: Control Module Input Power A Circuit/Open
    ka: მართვის მოდულის შემავალი კვების A წრედი/გაწყვეტა
  description:
    en: Open circuit on the input power line A of the control module. The module is missing or losing its main supply on this rail.
    ka: მართვის მოდულის A კვების ხაზის წრედის გაწყვეტა. მოდულს არ მიეწოდება ან კარგავს ძირითად კვებას ამ ხაზზე.
