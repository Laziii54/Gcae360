- code: P34A4
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Circuit Bank 1
    ka: ამწე ლილვის პოზიციის ამძრავის ტემპერატურის სენსორის წრედი, ბანკი 1
  description:
    en: Generic electrical fault on the temperature sensor of the intake camshaft position actuator on bank 1 (used by ECU to thermally protect the VVT actuator from overheating).
    ka: ზოგადი ელექტრული შეცდომა ბანკი 1-ის შემშვები გამანაწილებელი ლილვის ამძრავის ტემპერატურის სენსორზე (გამოიყენება ECU-ს მიერ VVT ამძრავის გადახურებისგან დასაცავად).
  affected_components:
    - cam_actuator_a_temp_sensor_b1
    - sensor_wiring
  common_causes:
    - id: sensor_failed
      likelihood: high
      label:
        en: Temperature sensor failed
        ka: ტემპერატურის სენსორი მწყობრიდან გამოვიდა
  symptoms:
    - en: Check engine light on
