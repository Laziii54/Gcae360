    ka: ბანკი 2-ის შემშვები გამანაწილებელი ლილვის პოზიციის ამძრავის მართვის დრაივერი იუწყება დენის გადაჭარბებას ან გადახურებას. გამანაწილებელი ლილვის პოზიციის სენსორი განსაზღვრავს, თუ რომელი ცილინდრია შეკუმშვის ტაქტზე — მის გარეშე ECM ვერ უზრუნველყოფს თანმიმდევრულ ინექციას ან ანთების სისტემის სწორ მუშაობას.
  affected_components:
    - cam_actuator_a_driver_b2
    - cam_actuator_a_b2
  common_causes:
    - id: short_circuit
      likelihood: high
      label:
        en: Short circuit in actuator wiring or coil
        ka: მოკლე ჩართვა ამძრავის გაყვანილობაში ან კოჭაში
