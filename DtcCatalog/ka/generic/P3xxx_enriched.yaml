  description:
    en: The dedicated camshaft position control module reports an internal performance fault — self-diagnostic flagged an issue with internal computation, drivers or sensor interfaces.
    ka: გამანაწილებელი ლილვის პოზიციის მართვის სპეციალიზებული მოდული იუწყება შიდა მუშაობის ხარვეზს — თვითდიაგნოსტიკამ გამოავლინა პრობლემა შიდა გამოთვლებში, დრაივერებში ან სენსორების ინტერფეისებში.
