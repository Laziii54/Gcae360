    - en: Check engine light on
      ka: ძრავის გაუმართაობის ინდიკატორი-ის ინდიკატორის ანთება
    - en: Power loss especially in mid-rpm range
      ka: სიმძლავრის დაკარგვა, განსაკუთრებით საშუალო ბრუნთა რიცხვის დიაპაზონში
    - en: Possible rough idle or stalling
      ka: შესაძლო არასტაბილური ბრუნები უქმ სვლაზე ან ძრავის ჩაქრობა
    - en: Increased fuel consumption
      ka: საწვავის მოხმარების ზრდა
