  category: powertrain
  title:
    en: Cylinder 1 Deactivation Stuck On
    ka: მე-1 ცილინდრის გამორთვის ფუნქცია გაჭედილია ჩართულ მდგომარეობაში
  description:
    en: The engine control module has detected that cylinder 1 remains deactivated when activation is commanded — the deactivation hardware is stuck in the off state. Symptoms include rough running and reduced power.
    ka: ძრავის მართვის მოდულმა დააფიქსირა, რომ ცილინდრი 1 რჩება გათიშული მაშინ, როცა გააქტიურების ბრძანება გაცემულია — გათიშვის მექანიზმი ჩარჩენილია გამორთულ მდგომარეობაში. სიმპტომები მოიცავს ძრავის არასტაბილურ მუშაობას და სიმძლავრის შემცირებას.
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
  common_causes:
    - id: lifter_stuck_collapsed
      likelihood: high
      label:
        en: Lifter stuck collapsed
        ka: კლაპნის ამწევი მექანიზმი გაჭედილია შეკუმშულ მდგომარეობაში
    - id: solenoid_stuck_open
      likelihood: medium
      label:
        en: Solenoid stuck in deactivation position
        ka: სოლენოიდი გაჭედილია გამორთვის პოზიციაში
    - id: stuck_carbon_buildup
      likelihood: low
      label:
        en: Carbon or debris buildup preventing free movement
        ka: ნადები ან ნარჩენები აფერხებს თავისუფალ მოძრაობას
