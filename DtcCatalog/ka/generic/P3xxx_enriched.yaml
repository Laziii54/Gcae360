- code: P3400
  category: powertrain
  title:
    en: Cylinder Deactivation System Bank 1
    ka: ცილინდრების გათიშვის სისტემა, ბანკი 1
  description:
    en: The engine control module has detected a fault in the cylinder deactivation system on bank 1. Variable displacement engines shut off cylinders under low load to save fuel — a fault here disables the function.
    ka: ძრავის მართვის მოდულმა (ECM) დააფიქსირა გაუმართაობა ბანკი 1-ის ცილინდრების გათიშვის სისტემაში. ცვლადი მოცულობის ძრავები საწვავის დაზოგვის მიზნით დაბალი დატვირთვისას თიშავენ ცილინდრებს — აქ არსებული გაუმართაობა თიშავს ამ ფუნქციას.
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - oil_control_valve
  common_causes:
    - id: deactivation_solenoid_failed
      likelihood: high
      label:
        en: Deactivation solenoid or oil control valve failed
        ka: გამორთვის სოლენოიდის ან ზეთის მართვის სარქვლის გაუმართაობა
    - id: lifter_stuck
      likelihood: medium
      label:
        en: Collapsing lifter stuck
        ka: ჰიდროკომპენსატორის გაჭედვა
    - id: low_oil_pressure
      likelihood: medium
      label:
        en: Low oil pressure prevents activation
        ka: ზეთის დაბალი წნევა აფერხებს გააქტიურებას
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 200
      - 1500
    estimated_hours:
      - 1.5
      - 8.0
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
  references:
    - sae:J2012
  related_codes:
    - P3410
    - P3497
  sources:
    - https://en.wikipedia.org/wiki/Variable_displacement
    - https://en.wikipedia.org/wiki/Cylinder_deactivation
- code: P3401
  category: powertrain
  title:
    en: Cylinder 1 Deactivation/Intake Valve Control Circuit Open
    ka: ცილინდრი 1-ის დეაქტივაციის/შემშვები სარქვლის მართვის წრედის გაწყვეტა
  description:
    en: The engine control module has detected an open circuit at the cylinder 1 deactivation or intake valve control solenoid. Without a valid circuit, cylinder 1 cannot be deactivated.
    ka: ძრავის მართვის მოდულმა დააფიქსირა წრედის გაწყვეტა პირველი ცილინდრის გათიშვის ან შემშვები სარქვლის მართვის სოლენოიდზე. მოქმედი წრედის გარეშე, პირველი ცილინდრის გათიშვა შეუძლებელია.
  affected_components:
    - cylinder_deactivation_solenoid
    - engine_wiring_harness
    - ecm
  common_causes:
    - id: solenoid_coil_open
      likelihood: high
      label:
        en: Solenoid coil open
        ka: სოლენოიდის კოჭა გაწყვეტილია
    - id: wiring_open
      likelihood: medium
      label:
        en: Wiring or connector open
        ka: გაყვანილობის ან კონექტორის წრედის გაწყვეტა
    - id: connector_back_out
      likelihood: low
      label:
        en: Pin pushed back out of connector body
        ka: პინი გამოვარდნილია კონექტორის კორპუსიდან
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 150
      - 1200
    estimated_hours:
      - 1.0
      - 6.0
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
  references:
    - sae:J2012
  related_codes:
    - P3425
  sources:
    - https://en.wikipedia.org/wiki/Cylinder_deactivation
    - https://en.wikipedia.org/wiki/On-board_diagnostics
- code: P3402
  category: powertrain
  title:
    en: Cylinder 1 Deactivation Performance/Stuck Off
    ka: ცილინდრი 1-ის დეაქტივაციის მუშაობის ხარვეზი/გაჭედვა
  description:
    en: The engine control module has detected that cylinder 1 remains deactivated when activation is commanded — the cylinder does not contribute to combustion when expected.
    ka: ძრავის მართვის მოდულმა დააფიქსირა, რომ მე-1 ცილინდრი რჩება გამორთული გააქტიურების ბრძანების მიუხედავად — ცილინდრი არ მონაწილეობს წვაში, როდესაც ეს მოსალოდნელია.
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - oil_control_valve
  common_causes:
    - id: lifter_stuck_collapsed
      likelihood: high
      label:
        en: Lifter stuck collapsed
        ka: კლაპნის ამწევი მექანიზმი გაჭედილია შეკუმშულ მდგომარეობაში
    - id: solenoid_stuck
      likelihood: medium
      label:
        en: Solenoid stuck
        ka: სოლენოიდი გაჭედილია
    - id: stuck_carbon_buildup
      likelihood: low
      label:
        en: Carbon or debris buildup preventing free movement
        ka: ნადები ან ნარჩენები აფერხებს თავისუფალ მოძრაობას
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 300
      - 2000
    estimated_hours:
      - 2.0
      - 10.0
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
  references:
    - sae:J2012
  sources:
    - https://en.wikipedia.org/wiki/Cylinder_deactivation
    - https://en.wikipedia.org/wiki/On-board_diagnostics
