        ka: მოდულის შიდა ხარვეზი
    - id: needs_reflash
      likelihood: low
      label:
        en: Module software outdated, reflash may resolve
        ka: მოდულის პროგრამული უზრუნველყოფა მოძველებულია, შესაძლოა განახლებამ გადაჭრას პრობლემა
    - id: voltage_supply_issue
      likelihood: low
      label:
