        en: Broken heating grid line
        ka: გამათბობელი ბადის გაწყვეტილი ხაზი
    - id: relay_fault
      likelihood: medium
      label:
        en: Rear defrost relay failed
        ka: უკანა საქარე მინის გამათბობლის რელეს გაუმართაობა
  symptoms:
