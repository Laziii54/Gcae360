    ka: წინა საწმენდების ძრავის სიჩქარის წრედი
  description:
    en: The body control module has detected that the front wiper motor speed feedback does not match the commanded speed. The motor may run only on one speed or not at all.
    ka: სხეულის მართვის მოდულმა (BCM) აღმოაჩინა, რომ წინა საწმენდების ძრავის სიჩქარის უკუკავშირი არ ემთხვევა მითითებულ სიჩქარეს. ძრავა შესაძლოა მუშაობდეს მხოლოდ ერთი სიჩქარით ან საერთოდ არ მუშაობდეს.
