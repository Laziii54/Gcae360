- code: B0001
  category: body
  title:
    en: Driver Frontal Stage 1 Deployment Control
    ka: მძღოლის წინა აირბაგის 1-ლი საფეხურის გაშლის მართვა
  description:
    en: The supplemental restraint system (SRS) module has detected a fault in the deployment control circuit for the first stage of the driver frontal airbag. The SRS warning lamp illuminates and airbag deployment may be impaired in a crash event.
    ka: SRS მოდულმა დააფიქსირა ხარვეზი მძღოლის წინა აირბაგის პირველი საფეხურის გაშლის მართვის წრედში. SRS-ის გამაფრთხილებელი ნათურა ანთებულია და ავარიის შემთხვევაში აირბაგის გაშლა შესაძლოა შეფერხდეს.
  affected_components:
    - driver_airbag_module
    - srs_control_module
    - srs_wiring
    - clock_spring
  common_causes:
    - id: clock_spring_failure
      likelihood: high
      label:
        en: Clock spring (spiral cable) damaged in steering column
        ka: საჭის სვეტში დაზიანებულია ზამბარა-კაბელი (სპირალური კაბელი)
    - id: airbag_connector_loose
      likelihood: medium
      label:
        en: Loose or corroded airbag connector under steering wheel
        ka: საჭის ქვეშ აირბაგის კონექტორის მოშვება ან კოროზია
    - id: srs_module_fault
      likelihood: low
      label:
        en: SRS control module internal fault
        ka: SRS მართვის მოდულის შიდა გაუმართაობა
  symptoms:
    - en: Warning light or symbol related to the affected system
      ka: გამაფრთხილებელი ნათურა ან სიმბოლო, რომელიც დაკავშირებულია შესაბამის სისტემასთან
    - en: Comfort or safety function impaired
      ka: კომფორტის ან უსაფრთხოების ფუნქციის შეფერხება
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 200
      - 1500
    estimated_hours:
      - 1.0
      - 4.0
  flags:
    mil: false
    emissions_relevant: false
  references:
    - sae:J2012
  sources:
    - https://en.wikipedia.org/wiki/Airbag
    - https://en.wikipedia.org/wiki/Body_control_module
- code: B0002
  category: body
  title:
    en: Driver Frontal Stage 2 Deployment Control
    ka: მძღოლის წინა უსაფრთხოების ბალიშის მე-2 საფეხურის გაშლის მართვა
  description:
    en: The SRS module has detected a fault in the deployment control circuit for the second stage of the driver frontal airbag. Dual-stage airbags use two charges for severity-dependent deployment — this code indicates the high-severity stage cannot be triggered reliably.
    ka: SRS მოდულმა დააფიქსირა გაუმართაობა მძღოლის წინა აირბაგის მეორე საფეხურის გააქტიურების მართვის წრედში. ორსაფეხურიანი აირბაგები იყენებენ ორ მუხტს სიმძიმის მიხედვით გააქტიურებისთვის — ეს კოდი მიუთითებს, რომ მაღალი სიმძიმის საფეხურის გააქტიურება საიმედოდ ვერ ხერხდება.
  affected_components:
    - driver_airbag_module
    - srs_control_module
    - srs_wiring
    - clock_spring
  common_causes:
    - id: clock_spring_failure
      likelihood: high
      label:
        en: Clock spring damaged or worn
        ka: საჭის სპირალი დაზიანებულია ან გაცვეთილია
    - id: airbag_squib_circuit
      likelihood: medium
      label:
        en: Stage 2 squib circuit open or shorted
        ka: მე-2 საფეხურის პიროტექნიკური ვაზნის წრედის გაწყვეტა ან მოკლე ჩართვა
    - id: srs_module_fault
      likelihood: low
      label:
        en: SRS control module fault
        ka: SRS მართვის მოდულის გაუმართაობა
  symptoms:
    - en: Warning light or symbol related to the affected system
      ka: გამაფრთხილებელი ნათურა ან სიმბოლო, რომელიც დაკავშირებულია შესაბამის სისტემასთან
    - en: Comfort or safety function impaired
      ka: კომფორტის ან უსაფრთხოების ფუნქციის შეფერხება
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 200
      - 1500
    estimated_hours:
      - 1.0
      - 4.0
  flags:
    mil: false
    emissions_relevant: false
  references:
    - sae:J2012
  sources:
    - https://en.wikipedia.org/wiki/Airbag
    - https://en.wikipedia.org/wiki/Body_control_module
- code: B0003
  category: body
  title:
    en: Driver Frontal Deployment Loop Resistance Low
    ka: მძღოლის წინა უსაფრთხოების ბალიშის გააქტიურების მარყუჟის წინააღმდეგობა დაბალია
  description:
    en: The SRS module has detected that the resistance in the driver frontal airbag deployment loop is below the expected range, suggesting a short or partial short between the squib leads. The airbag warning lamp is illuminated.
    ka: SRS მოდულმა დაადგინა, რომ მძღოლის წინა აირბაგის გაშლის წრედში წინაღობა მოსალოდნელ დიაპაზონზე დაბალია, რაც მიუთითებს მოკლე ჩართვაზე ან ნაწილობრივ მოკლე ჩართვაზე პიროტექნიკური ვაზნის სადენებს შორის. ანთებულია აირბაგის გამაფრთხილებელი ნათურა.
  affected_components:
    - driver_airbag_module
    - clock_spring
    - srs_wiring
  common_causes:
    - id: shorted_squib_leads
      likelihood: high
      label:
        en: Shorted squib leads in clock spring or wiring
        ka: აირბაგის პიროპატრონის სადენების მოკლე ჩართვა საჭის სპირალში ან გაყვანილობაში
    - id: airbag_module_short
      likelihood: medium
      label:
        en: Internal short within driver airbag module
        ka: შიდა მოკლე ჩართვა მძღოლის უსაფრთხოების ბალიშის მოდულში
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Connector corrosion bridging pins
        ka: კონექტორის კოროზია, რომელიც იწვევს პინების დამოკლებას
  symptoms:
    - en: Warning light or symbol related to the affected system
      ka: გამაფრთხილებელი ნათურა ან სიმბოლო, რომელიც დაკავშირებულია შესაბამის სისტემასთან
    - en: Comfort or safety function impaired
      ka: კომფორტის ან უსაფრთხოების ფუნქციის შეფერხება
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 200
      - 1200
    estimated_hours:
      - 1.0
      - 3.0
  flags:
    mil: false
    emissions_relevant: false
  references:
    - sae:J2012
  sources:
    - https://en.wikipedia.org/wiki/Airbag
    - https://en.wikipedia.org/wiki/Body_control_module
- code: B0004
  category: body
  title:
    en: Driver Frontal Deployment Loop Resistance High
    ka: მძღოლის წინა უსაფრთხოების ბალიშის გაშლის წრედის მაღალი წინაღობა
  description:
    en: The SRS module measured a higher than expected resistance in the driver frontal airbag deployment circuit. Causes include a partially open connection, corroded contacts, or a damaged clock spring conductor.
    ka: SRS მოდულმა დააფიქსირა მოსალოდნელზე მაღალი წინაღობა მძღოლის წინა აირბაგის გაშლის წრედში. მიზეზები მოიცავს ნაწილობრივ გაწყვეტილ კავშირს, დაჟანგულ კონტაქტებს ან საჭის სპირალური კაბელის დაზიანებას.
  affected_components:
    - driver_airbag_module
    - clock_spring
    - srs_wiring
  common_causes:
    - id: clock_spring_high_resistance
      likelihood: high
      label:
        en: Clock spring conductor partially worn
        ka: ზამბარა-კაბელის გამტარი ნაწილობრივ ცვეთილია
    - id: connector_oxidation
      likelihood: medium
      label:
        en: Oxidized airbag connector pins
        ka: აირბაგის კონექტორის პინების დაჟანგვა
    - id: airbag_module_fault
      likelihood: low
      label:
        en: Driver airbag module internal fault
        ka: მძღოლის აირბაგის მოდულის შიდა გაუმართაობა
  symptoms:
    - en: Warning light or symbol related to the affected system
      ka: გამაფრთხილებელი ნათურა ან სიმბოლო, რომელიც დაკავშირებულია შესაბამის სისტემასთან
    - en: Comfort or safety function impaired
      ka: კომფორტის ან უსაფრთხოების ფუნქციის შეფერხება
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 150
      - 1000
    estimated_hours:
      - 0.8
      - 3.0
  flags:
    mil: false
    emissions_relevant: false
  references:
    - sae:J2012
  sources:
    - https://en.wikipedia.org/wiki/Airbag
    - https://en.wikipedia.org/wiki/Body_control_module
- code: B0005
  category: body
  title:
    en: Driver Frontal Deployment Loop Open
    ka: მძღოლის წინა უსაფრთხოების ბალიშის გაშლის წრედის გაწყვეტა
  description:
    en: The SRS module detects an open circuit in the driver frontal airbag deployment loop. The airbag will not deploy in a crash and the SRS warning lamp is illuminated.
    ka: SRS მოდული აფიქსირებს წრედის გაწყვეტას მძღოლის წინა აირბაგის გაშლის კონტურში. ავარიის დროს აირბაგი არ გაიშლება და SRS-ის გამაფრთხილებელი ნათურა ანთებულია.
  affected_components:
    - driver_airbag_module
    - clock_spring
    - srs_wiring
  common_causes:
    - id: clock_spring_open
      likelihood: high
      label:
        en: Clock spring conductor broken
        ka: საჭის სპირალური კაბელის გამტარის გაწყვეტა
    - id: connector_disconnected
      likelihood: high
      label:
        en: Airbag connector unplugged or broken
        ka: აირბაგის კონექტორი გათიშულია ან დაზიანებულია
    - id: wiring_break
      likelihood: medium
      label:
        en: Wiring harness break in steering column
        ka: საჭის სვეტში გაყვანილობის გაწყვეტა
  symptoms:
    - en: Warning light or symbol related to the affected system
      ka: გამაფრთხილებელი ნათურა ან სიმბოლო, რომელიც დაკავშირებულია შესაბამის სისტემასთან
    - en: Comfort or safety function impaired
      ka: კომფორტის ან უსაფრთხოების ფუნქციის შეფერხება
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 150
      - 1100
    estimated_hours:
      - 0.8
      - 3.0
  flags:
    mil: false
    emissions_relevant: false
  references:
    - sae:J2012
  sources:
    - https://en.wikipedia.org/wiki/Airbag
    - https://en.wikipedia.org/wiki/Body_control_module
- code: B0006
  category: body
  title:
    en: Driver Frontal Deployment Loop Short to Ground
    ka: მძღოლის წინა უსაფრთხოების ბალიშის გაშლის წრედის დამიწებასთან მოკლე ჩართვა
  description:
    en: One of the deployment leads for the driver frontal airbag is shorted to ground. The SRS module disables deployment of the affected stage to prevent unintended firing.
    ka: მძღოლის წინა აირბაგის ერთ-ერთი გამშვები სადენი დამიწებულია. SRS მოდული თიშავს შესაბამისი საფეხურის გააქტიურებას არასასურველი ამოფრქვევის თავიდან ასაცილებლად.
  affected_components:
    - driver_airbag_module
    - srs_wiring
    - clock_spring
  common_causes:
    - id: chafed_wiring_to_ground
      likelihood: high
      label:
        en: Chafed wiring contacting metal
        ka: გაცვეთილი გაყვანილობა, რომელიც ეხება ლითონის დეტალს
    - id: water_intrusion
      likelihood: medium
      label:
        en: Water intrusion at connector
        ka: შემაერთებელში წყლის შეღწევა
    - id: airbag_module_short
      likelihood: low
      label:
        en: Internal airbag module short to housing
        ka: აირბაგის მოდულის შიდა მოკლე ჩართვა კორპუსთან
  symptoms:
    - en: Warning light or symbol related to the affected system
      ka: გამაფრთხილებელი ნათურა ან სიმბოლო, რომელიც დაკავშირებულია შესაბამის სისტემასთან
    - en: Comfort or safety function impaired
      ka: კომფორტის ან უსაფრთხოების ფუნქციის შეფერხება
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 150
      - 1000
    estimated_hours:
      - 1.0
      - 3.0
  flags:
    mil: false
    emissions_relevant: false
  references:
    - sae:J2012
  sources:
    - https://en.wikipedia.org/wiki/Airbag
    - https://en.wikipedia.org/wiki/Body_control_module
- code: B0007
  category: body
  title:
    en: Driver Frontal Deployment Loop Short to Battery
    ka: მძღოლის წინა უსაფრთხოების ბალიშის წრედი - მოკლე ჩართვა ბატარეასთან
  description:
    en: The driver frontal airbag deployment loop is shorted to battery voltage. This is potentially dangerous as it could cause unintended deployment; the SRS module isolates the circuit and sets the warning lamp.
    ka: მძღოლის წინა აირბაგის გაშლის წრედი დამოკლებულია ბატარეის ძაბვაზე. ეს პოტენციურად სახიფათოა, რადგან შეიძლება გამოიწვიოს აირბაგის უნებლიე გაშლა; SRS მოდული წყვეტს წრედს და ანთებს გამაფრთხილებელ ნათურას.
  affected_components:
    - driver_airbag_module
    - srs_wiring
    - clock_spring
  common_causes:
    - id: wiring_short_to_power
      likelihood: high
      label:
        en: Wiring shorted to powered conductor
        ka: გაყვანილობის მოკლე ჩართვა ძაბვის მქონე გამტართან
    - id: connector_damage
      likelihood: medium
      label:
        en: Damaged connector bridging power
        ka: კვების დამაკავშირებელი კონექტორის დაზიანება
    - id: srs_module_fault
      likelihood: low
      label:
        en: SRS module internal fault
        ka: SRS მოდულის შიდა გაუმართაობა
  symptoms:
    - en: Warning light or symbol related to the affected system
      ka: გამაფრთხილებელი ნათურა ან სიმბოლო, რომელიც დაკავშირებულია შესაბამის სისტემასთან
    - en: Comfort or safety function impaired
      ka: კომფორტის ან უსაფრთხოების ფუნქციის შეფერხება
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur:
      - 200
      - 1200
    estimated_hours:
      - 1.0
      - 3.5
  flags:
    mil: false
    emissions_relevant: false
  references:
    - sae:J2012
  sources:
    - https://en.wikipedia.org/wiki/Airbag
    - https://en.wikipedia.org/wiki/Body_control_module
- code: B0010
  category: body
  title:
    en: Right Front/Passenger Frontal Deployment Control
    ka: წინა მარჯვენა/მგზავრის მხარეს აირბაგის გაშლის მართვა
  description:
    en: 'Right Front/Passenger Frontal Deployment Control: the restraints module has detected a fault in this airbag/pretensioner deployment circuit, which may prevent correct deployment in a crash. Safety-critical.'
    ka: 'წინა მარჯვენა/მგზავრის მხარის აირბაგის გაშლის მართვა: უსაფრთხოების სისტემების მოდულმა აღმოაჩინა ხარვეზი აირბაგის/წინასწარი დამჭიმის გაშლის წრედში, რამაც შესაძლოა ხელი შეუშალოს მის სწორად გაშლას ავარიის დროს. კრიტიკული უსაფრთხოების საკითხია.'
  affected_components:
    - passenger_airbag_module
    - srs_control_module
    - srs_wiring
  common_causes:
    - id: passenger_airbag_connector
      likelihood: high
      label:
        en: Loose or corroded passenger airbag connector
