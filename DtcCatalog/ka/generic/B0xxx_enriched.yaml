  category: body
  title:
    en: Power Mirror Switch Circuit
    ka: ელექტროსარკის გადამრთველის ელექტრული წრედი
  description:
    en: The body control module has detected a fault in the power mirror switch circuit. The switch input does not match a valid pattern — mirror adjustment may be inoperative.
    ka: სხეულის მართვის მოდულმა (BCM) აღმოაჩინა ხარვეზი გვერდითი სარკეების რეგულირების გადამრთველის ელექტრულ წრედში. გადამრთველის სიგნალი არ შეესაბამება დასაშვებ პარამეტრებს, რის გამოც სარკეების რეგულირება შესაძლოა არ მუშაობდეს.
