    ka: დაფიქსირდა ხარვეზი წინა შეჯახების სენსორის წრედში, რომელიც გამოიყენება ფრონტალური დარტყმის გამოსავლენად და აირბაგების/ღვეზელების დამჭიმების გასააქტიურებლად.
