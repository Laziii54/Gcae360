    ka: წვიმის სენსორის მოდული
  description:
    en: The body control module has detected a fault in the rain sensor module on the windshield. Automatic wiper activation based on moisture detection is no longer available.
    ka: სხეულის მართვის მოდულმა (BCM) აღმოაჩინა ხარვეზი საქარე მინის წვიმის სენსორის მოდულში. ტენიანობაზე დაფუძნებული მინის საწმენდების ავტომატური გააქტიურება აღარ მუშაობს.
