    ka: მზის სხივების ინტენსივობის სენსორის ელექტრული წრედი
  description:
    en: The HVAC control module has detected an implausible signal from the sun load (solar) sensor, typically located on the dashboard. Automatic climate control uses this signal to bias cooling on the side facing the sun.
    ka: HVAC-ის მართვის მოდულმა დააფიქსირა არასარწმუნო სიგნალი მზის ინტენსივობის სენსორიდან, რომელიც ჩვეულებრივ დაფაზეა განთავსებული. ავტომატური კლიმატკონტროლი იყენებს ამ სიგნალს მზის მხარეს გაგრილების გასაძლიერებლად.
