- code: B0226
  category: body
  title:
    en: Headlamp Auto-Leveling Front Sensor
    ka: ფარების ავტომატური რეგულირების წინა სენსორი
  description:
    en: The body control module reports an implausible signal from the front ride-height sensor used by the automatic headlamp leveling system. Without valid input, the headlamp pitch cannot be corrected for vehicle load.
    ka: კორპუსის მართვის მოდული (BCM) იღებს არასარწმუნო სიგნალს წინა კლირენსის სენსორიდან, რომელიც გამოიყენება ფარების ავტომატური რეგულირების სისტემისთვის. ვალიდური მონაცემების გარეშე, ფარების დახრის კუთხე ვერ დარეგულირდება ავტომობილის დატვირთვის შესაბამისად.
  affected_components:
    - front_ride_height_sensor
    - headlamp_leveling_module
    - body_control_module
  common_causes:
    - id: ride_height_sensor_failed
      likelihood: high
      label:
        en: Front ride height sensor failed
        ka: წინა კლირენსის სენსორის გაუმართაობა
    - id: ride_height_linkage
