  category: body
  title:
    en: Driver Door Lock Cylinder Switch Circuit
    ka: მძღოლის კარის საკეტის ცილინდრის გადამრთველის წრედი
  description:
    en: The body control module has detected a fault in the driver door lock cylinder switch circuit. This switch detects key rotation in the door lock and is used for keyless functions and the alarm system.
    ka: BCM-მა დააფიქსირა ხარვეზი მძღოლის კარის საკეტის ცილინდრის გადამრთველის წრედში. ეს გადამრთველი აფიქსირებს გასაღების მობრუნებას კარის საკეტში და გამოიყენება უგასაღებო წვდომის ფუნქციებისა და სიგნალიზაციის სისტემისთვის.
