    ka: BCM-მა აღმოაჩინა ხარვეზი მძღოლის კარის გაღების გადამრთველში. კარის ღია მდგომარეობა საიმედოდ ვერ იკითხება — ეს გავლენას ახდენს სალონის განათებაზე, უსაფრთხოების ღვედის გაფრთხილებასა და დისტანციური დაქოქვის სისტემაზე.
  affected_components:
    - door_jamb_switch
    - door_wiring_harness
    - body_control_module
  common_causes:
    - id: switch_stuck
      likelihood: high
      label:
        en: Door jamb switch stuck or corroded
        ka: კარის ჩამკეტი სენსორი გაჭედილია ან დაჟანგული
    - id: wiring_open
      likelihood: medium
      label:
        en: Wiring open in door hinge
        ka: კარის ანჯამაში გაყვანილობის გაწყვეტა
  symptoms:
    - en: Warning light or symbol related to the affected system
      ka: გამაფრთხილებელი ნათურა ან სიმბოლო, რომელიც დაკავშირებულია შესაბამის სისტემასთან
    - en: Comfort or safety function impaired
