<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OBD360 App Store screenshots</title>
<!--
  Renders ONE App Store screenshot per URL hash:  slides.html#1 ... slides.html#8
  Designed on a 1179 px wide canvas and scaled to the window width, so the same file
  exports 1179x2556 (iPhone 6.1"/6.3") and 1320x2868 (iPhone 6.9").
  Headlines/sublines live in the SLIDES array below - edit there to localise.
  Screens are the real app screenshots in ./src (status bar replaced by a clean 9:41 one).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-0:#021a4a; --navy-1:#06307a; --navy-2:#0b49a8;
    --cyan:#3cc0ff; --cyan-glow:#19a7f5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#021a4a;overflow:hidden}
  .canvas{
    position:relative; width:1179px; overflow:hidden; transform-origin:0 0;
    font-family:'Inter','Noto Sans Georgian','Segoe UI Variable','Segoe UI',system-ui,sans-serif; color:#fff;
    background:
      radial-gradient(1100px 900px at 88% 46%, rgba(25,167,245,.50), transparent 62%),
      radial-gradient(900px 800px at -5% 92%, rgba(14,86,200,.75), transparent 65%),
      linear-gradient(168deg, var(--navy-2) 0%, var(--navy-1) 44%, var(--navy-0) 100%);
  }
  /* diagonal "slash" echoing the app icon */
  .streak{position:absolute; left:-260px; top:1500px; width:1800px; height:14px; border-radius:14px;
    background:linear-gradient(90deg,transparent 0%,rgba(60,192,255,.0) 8%,rgba(60,192,255,.95) 42%,rgba(190,236,255,1) 52%,rgba(60,192,255,.0) 92%);
    transform:rotate(-31deg); filter:blur(.6px); opacity:.8}
  .streak.b{top:1590px; height:5px; opacity:.5}
  .spark{position:absolute; width:26px; height:26px; background:#fff; opacity:.55;
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
  .brand{position:absolute; left:90px; top:70px; display:flex; align-items:center; gap:22px}
  .brand img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .brand span{font-weight:800;font-size:52px;letter-spacing:-.01em}
  .copy{position:absolute; left:90px; right:90px; top:212px}
  .h{font-weight:800; font-size:116px; line-height:1.03; letter-spacing:-.03em; margin:0}
  .h em{font-style:normal; color:var(--cyan)}
  .s{margin:34px 0 0; font-size:47px; line-height:1.28; font-weight:500; color:rgba(255,255,255,.82); max-width:960px}

  /* phone */
  .phone{position:absolute; left:50%; top:700px; width:940px; transform:translateX(-50%);
    border-radius:122px; padding:7px;
    background:linear-gradient(145deg,#7b8494 0%,#2a313c 22%,#0d1117 55%,#2d3541 82%,#6a7383 100%);
    box-shadow:0 70px 150px rgba(0,8,30,.65), 0 0 160px rgba(25,167,245,.22);}
  .phone:before{content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 2px rgba(255,255,255,.16); pointer-events:none}
  .btn{position:absolute; width:8px; border-radius:4px; background:linear-gradient(90deg,#3b4350,#7b8494)}
  .btn.l{left:-7px}.btn.r{right:-7px; background:linear-gradient(270deg,#3b4350,#7b8494)}
  .glass{background:#000; border-radius:116px; padding:13px}
  .screen{position:relative; width:100%; border-radius:103px; overflow:hidden; background:#fff; aspect-ratio:739/1600}
  .screen>img.shot{position:absolute; inset:0; width:100%; height:100%; display:block}
  .sbar{position:absolute; left:0; right:0; top:0; height:98px}
  .time{position:absolute; left:84px; top:35px; font-weight:700; font-size:42px; line-height:58px; color:#0b0d10; letter-spacing:-.01em}
  .icons{position:absolute; right:74px; top:44px; display:flex; align-items:center; gap:16px}
  .island{position:absolute; top:27px; left:50%; transform:translateX(-50%); width:268px; height:78px; border-radius:40px; background:#000; z-index:3}
  .mask{position:absolute; display:flex; align-items:center; font-weight:400; color:#6b7280; letter-spacing:.01em}

  /* languages slide (no phone): 3x3 grid of cards, same badge codes as the in-app language picker */
  .langs{position:absolute; left:90px; right:90px; top:690px; display:grid; grid-template-columns:repeat(3,1fr); gap:26px}
  .lang{height:560px; border-radius:54px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.06)); border:2px solid rgba(255,255,255,.22);
    box-shadow:0 30px 70px rgba(0,8,30,.35)}
  .lang .badge{width:164px; height:164px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:62px; letter-spacing:.02em; color:#fff;
    background:linear-gradient(150deg,#3cc0ff,#1d5bd4); box-shadow:0 14px 34px rgba(25,167,245,.45), inset 0 2px 0 rgba(255,255,255,.35)}
  .lang .nm{font-weight:800; font-size:47px; letter-spacing:-.02em; line-height:1.1}
  .lang .en{font-weight:500; font-size:33px; color:rgba(255,255,255,.7); margin-top:-18px}

  /* iPad 13" layout (?d=ipad): 2064 px wide design, centred text, the same iPhone mock-up shown larger */
  body.ipad .canvas{width:2064px}
  body.ipad .streak{left:-400px; top:1750px; width:2900px; transform:rotate(-24deg)}
  body.ipad .streak.b{top:1845px}
  body.ipad .brand{left:0; right:0; top:96px; justify-content:center}
  body.ipad .brand img{width:104px; height:104px; border-radius:25px}
  body.ipad .brand span{font-size:66px}
  body.ipad .copy{left:140px; right:140px; top:230px; text-align:center}
  body.ipad .h{font-size:160px}
  body.ipad .s{font-size:64px; max-width:none; margin-top:46px}
  body.ipad .phone{top:800px; transform:translateX(-50%) scale(1.2); transform-origin:50% 0}
  body.ipad .langs{left:210px; right:210px; top:800px; gap:40px}
  body.ipad .lang{height:590px; gap:34px; border-radius:64px}
  body.ipad .lang .badge{width:196px; height:196px; font-size:74px}
  body.ipad .lang .nm{font-size:60px}
  body.ipad .lang .en{font-size:40px; margin-top:-20px}

  /* "in motion" slide (camera view): phone leans forward, decorative speed lines left and right of it.
     The numbers inside the screenshot are untouched; only the surroundings are decoration. */
  .mlines{position:absolute; left:0; right:0; top:0; height:2760px; display:none; pointer-events:none}
  .ml{position:absolute; border-radius:6px; filter:blur(.7px)}
  .ml.l{background:linear-gradient(90deg,rgba(190,236,255,0) 0%,rgba(215,243,255,.95) 28%,rgba(215,243,255,.95) 100%)}
  .ml.r{background:linear-gradient(90deg,rgba(215,243,255,.95) 0%,rgba(215,243,255,.95) 72%,rgba(190,236,255,0) 100%)}
  body.motion .phone{transform:translateX(-50%) rotate(-4deg); transform-origin:50% 60%}
  body.ipad.motion .phone{transform:translateX(-50%) scale(1.04) rotate(-4deg); transform-origin:50% 0}
  body.motion .mlines{display:block}
  body.motion .streak{display:none}
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="streak"></div><div class="streak b"></div>
  <div class="spark" style="left:930px;top:1150px"></div>
  <div class="spark" style="left:96px;top:1760px;width:18px;height:18px;opacity:.35"></div>
  <div class="spark" style="left:1010px;top:2230px;width:20px;height:20px;opacity:.4"></div>

  <div class="brand" id="brand" style="display:none"><img src="src/icon.png" alt=""><span>OBD360</span></div>
  <div class="copy"><h1 class="h" id="h"></h1><p class="s" id="s"></p></div>

  <div class="langs" id="langs" style="display:none"></div>
  <div class="mlines" id="mlines"></div>

  <div class="phone" id="phone">
    <i class="btn l" style="top:250px;height:70px"></i>
    <i class="btn l" style="top:360px;height:130px"></i>
    <i class="btn l" style="top:510px;height:130px"></i>
    <i class="btn r" style="top:420px;height:200px"></i>
    <div class="glass"><div class="screen" id="screen">
      <img class="shot" id="shot" alt="">
      <div class="sbar" id="sbar">
        <div class="time">9:41</div>
        <div class="icons">
          <!-- signal -->
          <svg width="46" height="30" viewBox="0 0 46 30" fill="#0b0d10"><rect x="0" y="19" width="8" height="11" rx="2"/><rect x="12" y="13" width="8" height="17" rx="2"/><rect x="24" y="7" width="8" height="23" rx="2"/><rect x="36" y="0" width="8" height="30" rx="2"/></svg>
          <!-- wifi -->
          <svg width="46" height="32" viewBox="0 0 46 32" fill="none" stroke="#0b0d10" stroke-width="5" stroke-linecap="round"><path d="M3 11.5C14 1 32 1 43 11.5"/><path d="M10 19C17 12.500 29 12.500 36 19"/><circle cx="23" cy="26" r="2.600" fill="#0b0d10" stroke="none"/></svg>
          <!-- battery -->
          <svg width="76" height="34" viewBox="0 0 76 34" fill="none"><rect x="1.500" y="1.500" width="64" height="31" rx="9" stroke="#0b0d10" stroke-opacity=".4" stroke-width="3"/><rect x="5.500" y="5.500" width="56" height="23" rx="5.500" fill="#0b0d10"/><path d="M69 11.500v11c3-.8 5-3.200 5-5.500s-2-4.700-5-5.500z" fill="#0b0d10" fill-opacity=".45"/></svg>
        </div>
      </div>
      <div class="mask" id="mask" style="display:none"></div>
      <div class="island"></div>
    </div></div>
  </div>
</div>

<script>
/* ---- edit headlines / sublines here ---- */
const SLIDES = {
  1:{h:'Read &amp; clear<br><em>fault codes</em>',            s:'Possible causes listed for every code',                  bar:'#f3f5f2'},
  2:{h:'See the moment<br><em>a fault</em> happened',          s:'Freeze-frame data: RPM, load, fuel trim',       bar:'#f3f5f2'},
  3:{h:'Check a car<br><em>before you buy</em>',               s:'Full check with one button + PDF report',        bar:'#f3f5f2'},
  4:{h:'Hybrid battery<br><em>health check</em>',              s:'Cell voltages, capacity and state of health',            bar:'#f3f5f2'},
  5:{h:'Will it pass<br><em>inspection?</em>',                 s:'Step-by-step technical inspection check',                bar:'#f3f5f2'},
  6:{h:'Odometer from<br><em>the car’s modules</em>',     s:'Compare it with the dashboard reading',        bar:'#fefefe',
     mask:{left:13.9, top:17.0, w:38.5, h:2.2, bg:'#ffffff', text:'1FMCU9E7•••••••••', size:31}},
  7:{h:'Oil life &amp;<br><em>service reminders</em>',        s:'Track oil, brake fluid, filters and more',               bar:'#fafbff'},
  8:{h:'Measure <em>0–100</em><br>acceleration',          s:'Real OBD speed, 8 samples per second',                   bar:'#f3f5f2'},
  // Camera view of the 0-100 page (real screenshot, status bar left out: it is a full-screen video view)
  10:{h:'Film your <em>0–100</em><br>run in the car',      s:'Live speed and split times over the video',        cam:true},
  // Same 9 languages as Services/Localization/LanguageCatalog.cs (code badge, native name, English name)
  9:{h:'Speaks <em>your<br>language</em>',                     s:'9 languages built in, switch any time',
     langs:[['EN','English','English'],['KA','ქართული','Georgian'],['DE','Deutsch','German'],
            ['FR','Français','French'],['IT','Italiano','Italian'],['ES','Español','Spanish'],
            ['PT','Português','Portuguese'],['PL','Polski','Polish'],['TR','Türkçe','Turkish']]}
};
const n = parseInt((location.hash||'#1').slice(1),10) || 1;
const d = SLIDES[n];
const IPAD = new URLSearchParams(location.search).get('d') === 'ipad';
if (IPAD) document.body.classList.add('ipad');
document.getElementById('h').innerHTML = d.h;
document.getElementById('s').textContent = d.s;
if (d.langs){
  document.getElementById('phone').style.display = 'none';
  document.querySelectorAll('.streak,.spark').forEach(e => e.style.display = 'none'); // keep the card grid clean
  const g = document.getElementById('langs'); g.style.display = 'grid';
  g.innerHTML = d.langs.map(l => '<div class="lang"><div class="badge">'+l[0]+'</div><div class="nm">'+l[1]+'</div><div class="en">'+l[2]+'</div></div>').join('');
} else {
  document.getElementById('shot').src = 'src/' + String(n).padStart(2,'0') + '.jpg';
  if (d.cam) {
    document.getElementById('sbar').style.display = 'none';
    document.body.classList.add('motion');
    // decorative speed lines: [side, top, length, thickness-ish opacity]
    // decorative speed lines (page coordinates on the 1179-wide design). Left lines: [top, startX, thickness, opacity] and fade in towards the phone;
    // right lines: [top, endX, thickness, opacity] and start behind the phone, fading out to the right.
    const LEFT  = [[655,10,4,.6],[742,0,7,.9],[868,24,3,.5],[981,0,8,.95],[1092,16,4,.65],[1215,0,6,.85],[1336,30,3,.55],[1440,0,9,.95],[1570,12,5,.7],[1702,0,4,.6],[1810,20,8,.9],[1952,0,4,.65],[2090,10,6,.8],[2236,0,3,.55],[2370,18,7,.85]];
    const RIGHT = [[690,1179,5,.7],[810,1179,8,.95],[930,1160,3,.5],[1040,1179,6,.85],[1160,1150,4,.6],[1268,1179,9,.95],[1390,1165,4,.65],[1496,1179,7,.85],[1618,1145,3,.55],[1736,1179,8,.95],[1860,1160,4,.65],[1985,1179,6,.8],[2120,1150,3,.55],[2260,1179,8,.9],[2400,1165,5,.7]];
    const sx = IPAD ? 2064 / 1179 : 1, sy = IPAD ? 1.08 : 1, mk = (side, a) => {
      const top = Math.round(a[0] * sy), x = Math.round(a[1] * sx), th = Math.round(a[2] * (IPAD ? 1.3 : 1));
      const from = side === 'l' ? x : Math.round(880 * sx), to = side === 'l' ? Math.round(230 * sx) : x;
      return '<i class="ml ' + side + '" style="top:' + top + 'px;left:' + from + 'px;width:' + (to - from) + 'px;height:' + th + 'px;opacity:' + a[3] + '"></i>';
    };
    document.getElementById('mlines').innerHTML = LEFT.map(a => mk('l', a)).join('') + RIGHT.map(a => mk('r', a)).join('');
  } else {
    document.getElementById('sbar').style.background = d.bar;
  }
}
if (n === 1) document.getElementById('brand').style.display = 'flex';
if (d.mask){
  const m = document.getElementById('mask'), M = d.mask;
  Object.assign(m.style,{display:'flex',left:M.left+'%',top:M.top+'%',width:M.w+'%',height:M.h+'%',background:M.bg,fontSize:M.size+'px'});
  m.textContent = M.text;
}
// scale the 1179-wide design to whatever window size we render at (1179x2556, 1320x2868, ...)
function fit(){
  const base = IPAD ? 2064 : 1179, H = IPAD ? 2800 : 2760;   // design width / a canvas height taller than any target
  const k = (parseInt(new URLSearchParams(location.search).get('w'),10) || base) / base, c = document.getElementById('canvas');
  c.style.height = H + 'px'; // the phone bleeds off the bottom, the window clips it
  c.style.transform = 'scale(' + k + ')';
  document.body.style.height = document.documentElement.style.height = (H * k) + 'px'; // layout box must match the scaled canvas, otherwise the window shows the body colour below it
}
fit();
</script>
</body>
</html>
